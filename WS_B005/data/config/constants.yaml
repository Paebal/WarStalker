# Основные игровые константы
game:
  version: "1.00.000"
  max_health: 100
  max_free_actions: 5
  battle_turn_limit: 10
  companion_max_base: 3
  chosen_multiplier: 10
  game_difficulty: 1
  language: "ru"

player:
  speed_forward: 150
  speed_side: 100
  speed_back: 100

weapons:
  pm:
    name: "ПМ"
    type: 2
    magazine_size: 8
    total_ammo: 16
    damage_head: 30
    damage_body: 15
    caliber: "9x18"
  knife:
    name: "Нож"
    type: 3
    damage_head: 50
    damage_body: 30
    magazine_size: 1
