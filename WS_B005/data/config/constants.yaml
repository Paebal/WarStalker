  sell_price_factor: 0.8
  buy_price_factor: 1.0
  min_price: 1
  trader_default_greed: 1.0
  trader_sidorovich_greed: 1.3
  trader_barmen_greed: 1.2
  trader_stranger_greed: 1.5

# Бой
combat:
  max_battle_distance: 100
  min_battle_distance: 5
  default_start_distance_min: 5
  default_start_distance_max: 100

# Выбросы
emission:
  emission_round: 15
  super_emission_round: 100
  damage_min: 20
  damage_max: 30
  duration_min: 5
  duration_max: 15
  warning_before: 3
  shelters:
    - "ЧАЭС"
    - "Бар"
    - 'Завод "Юпитер"'
    - "Кордон"
    - "Затон"
    - "Лиманск"
    - "Деревня Новичков"
    - "Элеватор"

# Артефакты
artifacts:
  belt_slots: 5
  soul_revive_health_percent: 0.4

# Квесты
quests:
  max_active: 3
  base_reward_multiplier: 1.0

# Карта
map:
  window_width: 800
  window_height: 600
  background_image: "assets/maps/default_map.png"